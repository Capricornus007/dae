name: Lint

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to test for a release
        type: string
        required: true
  pull_request:
    paths:
      - "**/*.go"
      - "**/*.c"
      - "**/*.h"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "Dockerfile"
      - "scripts/check-build-env.sh"
      - "hack/maintenance/append_license_signature.sh"
      - ".github/workflows/**"
      - ".github/workflows/lint.yml"
  push:
    branches:
      - main
      - kdae
    paths:
      - "**/*.go"
      - "**/*.c"
      - "**/*.h"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "Dockerfile"
      - "scripts/check-build-env.sh"
      - "hack/maintenance/append_license_signature.sh"
      - ".github/workflows/**"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

jobs:
  go-lint:
    runs-on: ubuntu-22.04
    env:
      CGO_ENABLED: 0
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: ${{ inputs.ref }}

    - name: Install Go from the feed (golang/go master tip)
      uses: Capricornus007/repo/.github/actions/setup-feed-go@master

    - name: Apply the canonical build experiments
      run: make -s print-goexperiment-env >> "$GITHUB_ENV"

    # 不能用 golangci-lint-action：它釘 x/tools v0.50.0，讀不了 go tip 的 std export data
    # （實測 v0.50 ✗、v0.51 ✓）→ Lint 必紅。版本照舊 v2.13.2，只抬它的依賴。
    - name: Install golangci-lint v2.13.2 (with x/tools that reads Go tip)
      uses: Capricornus007/repo/.github/actions/setup-gcl@master
      with:
        version: v2.13.2
    - name: Run golangci-lint
      run: golangci-lint run --timeout=10m --build-tags=dae_stub_ebpf

  ebpf-lint:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: ${{ inputs.ref }}

    - name: Set up Perl
      uses: shogo82148/actions-setup-perl@ac3202722f5744e62a8fa3af3e1aaaebb08861f3 # v1
      with:
        perl-version: "5.38"

    - name: Run lint
      run: make ebpf-lint

  build-env:
    name: Build env single owner
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: ${{ inputs.ref }}

    # P3-19/P3-23: build inputs (GOEXPERIMENT, geo data pins) are owned by the
    # Makefile and scripts/fetch-geo-data.sh; a second copy in .github/ or in
    # the Dockerfile forks the released configuration and fails this gate.
    - name: Assert build inputs have a single owner
      run: ./scripts/check-build-env.sh

  spdx-headers:
    name: SPDX headers (changed files)
    # Incremental by design: only the *.go files this pull request adds or
    # modifies are checked, so the 58-file pre-existing backlog (P3-21) is
    # triaged separately instead of turning every PR red.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0

    - name: Check SPDX headers on files changed by this PR
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        mapfile -t files < <(git diff --diff-filter=ACMR --name-only "$BASE_SHA"...HEAD -- '*.go')
        if [ "${#files[@]}" -eq 0 ]; then
          echo "no changed .go files"
          exit 0
        fi
        printf 'changed: %s\n' "${files[@]}"
        ./hack/maintenance/append_license_signature.sh --check "${files[@]}"
